name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: node-rest-demo-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create ephemeral test secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secrets/test
          openssl rand -hex 24 > secrets/test/mongo_root_username
          openssl rand -hex 32 > secrets/test/mongo_root_password
          openssl rand -hex 32 > secrets/test/mongo_app_password
          openssl rand -hex 64 > secrets/test/jwt_secret
          openssl rand -hex 32 > secrets/test/smtp_password
          openssl rand -hex 32 > secrets/test/admin_password
          chmod 0444 secrets/test/*

      - name: Validate Compose configuration
        run: docker compose -f compose.test.yaml config --quiet

      - name: Build application image
        run: docker compose -f compose.test.yaml build app

      - name: Start isolated test stack
        run: docker compose -f compose.test.yaml up --detach --wait --no-build

      - name: Seed initial administrator
        run: docker compose -f compose.test.yaml exec -T app npm run seed:admin

      - name: Run integration tests
        run: docker compose -f compose.test.yaml exec -T app npm run test:integration

      - name: Audit production dependencies
        run: docker compose -f compose.test.yaml exec -T app npm audit --omit=dev

      - name: Clean up isolated test stack
        if: always()
        shell: bash
        run: |
          docker compose -f compose.test.yaml down --volumes --remove-orphans
          rm -rf secrets/test
