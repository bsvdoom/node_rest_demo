services:
  app:
    build:
      context: .
    stop_grace_period: 20s
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ${MONGO_APP_DATABASE:?Set MONGO_APP_DATABASE in .env}
      MONGODB_USER: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGODB_PASSWORD_FILE: /run/secrets/mongo_app_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      SMTP_SERVICE: ${SMTP_SERVICE:?Set SMTP_SERVICE in .env}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASS_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-}
      ADMIN_FAMILY_NAME: ${ADMIN_FAMILY_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_TEL: ${ADMIN_TEL:-}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - mongo_app_password
      - jwt_secret
      - smtp_password
      - admin_password
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"

  mongo:
    image: mongo:8.0.29-noble@sha256:021b2d5ae9d253f2cca17491cc8d03aed8df3c840f3252066aa62d3277fc406e
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:?Set MONGO_APP_DATABASE in .env}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:?Set MONGO_APP_DATABASE in .env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_root_username
      - mongo_root_password
      - mongo_app_password
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
      - ./docker/mongo-healthcheck.js:/docker-healthcheck.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--nodb", "--file", "/docker-healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:

secrets:
  mongo_root_username:
    file: ./secrets/mongo_root_username
  mongo_root_password:
    file: ./secrets/mongo_root_password
  mongo_app_password:
    file: ./secrets/mongo_app_password
  jwt_secret:
    file: ./secrets/jwt_secret
  smtp_password:
    file: ./secrets/smtp_password
  admin_password:
    file: ./secrets/admin_password
